name: Build and test LiveLy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure, build and run CTest
        run: cmake --workflow --preset ci
      - name: Bundle Windows compiler
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Path bundle
          Copy-Item build/lively.exe, LICENSE -Destination bundle/
          Copy-Item examples -Recurse -Destination bundle/
      - name: Bundle Unix compiler
        if: runner.os != 'Windows'
        run: tar -czf lively.tar.gz -C build lively -C .. examples LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: LiveLy-${{ runner.os }}-${{ runner.arch }}
          path: |
            bundle/
            lively.tar.gz
          if-no-files-found: error
